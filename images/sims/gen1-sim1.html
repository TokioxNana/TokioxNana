<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sim Name - Generation 1</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1c1c1c;
      color: white;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #111;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 35px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    .sim-profile {
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 15px;
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .sim-profile img {
      width: 180px;
      height: 180px;
      border-radius: 15px;
      object-fit: cover;
    }

    .sim-info h2 {
      margin: 0;
      font-size: 28px;
    }

    .sim-info p {
      margin-top: 10px;
      color: #bbb;
      font-size: 16px;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      color: #aaa;
      text-decoration: none;
    }

    .back-link:hover {
      color: white;
    }

    .section {
      margin-top: 30px;
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 15px;
    }

    .section h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>

  <header>
    <h1>Generation 1</h1>
  </header>

  <main>

    <a class="back-link" href="../index.html">← Zurück zur Startseite</a>

    <div class="sim-profile">
      <img src="../images/sim1.jpg" alt="Sim Bild">
      <div class="sim-info">
        <h2>Sim Name</h2>
        <p>Gründerin der Legacy Challenge</p>
      </div>
    </div>

    <div class="section">
      <h3>Über sie</h3>
      <p>
        Hier kommt später die Geschichte rein. Du kannst schreiben wie ihr Leben anfängt,
        wo sie wohnt, was ihre Ziele sind usw.
      </p>
    </div>

    <div class="section">
      <h3>Fotoalbum</h3>
      <p>
        Hier kommen später Bilder rein (Screenshots aus dem Spiel).
      </p>
    </div>

  </main>

</body>
</html>
