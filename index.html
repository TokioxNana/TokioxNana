<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TokioxNana - Sims Legacy</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #1c1c1c;
      color: white;
      margin: 0;
      padding: 0;
    }

    header {
      padding: 30px;
      text-align: center;
      background-color: #111;
    }

    header h1 {
      margin: 0;
      font-size: 40px;
    }

    header p {
      margin-top: 10px;
      font-size: 18px;
      color: #bbb;
    }

    main {
      padding: 30px;
      max-width: 900px;
      margin: auto;
    }

    .category {
      background-color: #2a2a2a;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    details {
      margin-top: 15px;
      background-color: #333;
      padding: 15px;
      border-radius: 10px;
    }

    summary {
      font-size: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .sim-card {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-top: 15px;
      padding: 12px;
      background-color: #444;
      border-radius: 12px;
      text-decoration: none;
      color: white;
      transition: 0.2s;
    }

    .sim-card:hover {
      background-color: #555;
      transform: scale(1.01);
    }

    .sim-card img {
      width: 80px;
      height: 80px;
      border-radius: 12px;
      object-fit: cover;
    }

    .sim-card h3 {
      margin: 0;
      font-size: 22px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>TokioxNana</h1>
    <p>Sims 4 Legacy Website ✨</p>
  </header>

  <main>

    <div class="category">
      <h2>Legacy Challenge</h2>
      <p>Hier findest du alle Generationen meiner Legacy Challenge.</p>

      <details>
        <summary>Generation 1</summary>

        <!-- SIM KARTE -->
        <a class="sim-card" href="sims/gen1-sim1.html">
          <img src="images/sim1.jpg" alt="Sim Bild">
          <div>
            <h3>Sim Name</h3>
            <p>Gründerin der Legacy Challenge</p>
          </div>
        </a>

      </details>

    </div>

  </main>

  <footer>
    © 2026 TokioxNana | Sims 4 Legacy
  </footer>

</body>
</html>
